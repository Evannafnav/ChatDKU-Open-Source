[project]
name = "chatdku-candidate-rag"
version = "0.1.0"
description = "Bilingual, cited, local-model agentic RAG candidate task"
requires-python = ">=3.11"
dependencies = ["dspy>=3,<4", "pypdf>=5,<7", "sentence-transformers>=3,<6", "numpy>=1.26,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
